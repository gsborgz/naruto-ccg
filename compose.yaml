# Banco local para o compartilhamento de decks (mesmo esquema do projeto pokedex):
# Redis + proxy HTTP compatível com a API REST da Upstash, usada em produção.
# Portas diferentes das do pokedex (6380/8079) para os dois poderem rodar juntos.
services:
  redis:
    container_name: 'naruto-ccg-redis'
    image: 'redis:6.2'
    ports:
      - '6381:6379'
  serverless-redis-http:
    container_name: 'naruto-ccg-serverless-redis-http'
    image: 'hiett/serverless-redis-http:latest'
    ports:
      - '8078:80'
    environment:
      SRH_MODE: 'env'
      SRH_TOKEN: 'local_dev_token'
      SRH_CONNECTION_STRING: 'redis://redis:6379'
    depends_on:
      - redis
